{% extends "base.html" %}
{% block title %}{{ t('template') }}{% endblock %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0">{% if template %}{{ t('edit') }}：{{ template.name }}{% else %}{{ t('new_template') }}{% endif %}</h2>
  <form method="post" action="/letters/templates/save">
    <input type="hidden" name="tid" value="{{ template.id if template else 0 }}">
    <div class="inline">
      <div><label>{{ t('template_name') }}</label><input name="name" value="{{ template.name if template else '' }}" required></div>
      <div style="flex:1"><label>{{ t('letter_subject') }}</label><input name="subject" style="width:100%" value="{{ template.subject if template else '' }}" required></div>
    </div>
    <label>{{ t('letter_body') }}</label>
    <textarea name="body_html">{% if template %}{{ template.body_html }}{% else %}{% raw %}<p>{{NAME}}，你好：</p>
<p>{{MESSAGE}}</p>
<p>以下是你 {{PERIOD}} 的奖金计划与结果：</p>
{{PLAN_TABLE}}
<p>所用支付 Curve（达成率 → 支付率，含区间斜率）：</p>
{{CURVE_SUMMARY}}
<p>如有疑问，请与你的经理或 BG 管理员联系。</p>{% endraw %}{% endif %}</textarea>
    <p>
      <button class="btn" type="submit" name="save_as_new" value="">{{ t('save') }}</button>
      {% if template %}<button class="btn secondary" type="submit" name="save_as_new" value="true">{{ t('save_as_new') }}</button>{% endif %}
    </p>
  </form>
</div>
{% endblock %}
