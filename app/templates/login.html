<!doctype html>
<html lang="{{ 'zh-CN' if lang == 'zh' else 'en' }}" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<title>{{ t('login') }} - {{ t('app_title') }}</title>
<link rel="stylesheet" href="/static/style.css?v=5.2">
</head>
<body>
<div class="login-wrap">
  <div class="login-hero">
    <span class="eyebrow">JUST CALCULATE IT™</span>
    <h1>{{ t('app_title') }}</h1>
  </div>
  <div class="login-box">
    <h2 style="margin-top:0">{{ t('app_title') }}</h2>
    <div style="margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap">
      <span class="theme-switch" title="{{ t('theme_hint') }}">
        <span class="theme-label">{{ t('theme') }}</span>
        <a class="swatch{% if theme == 'default' %} active{% endif %}" href="/theme/default"
           title="{{ t('theme_default') }}" style="--c1:#0a0a0a;--c2:#fa5400"></a>
        <a class="swatch{% if theme == 'morandi' %} active{% endif %}" href="/theme/morandi"
           title="{{ t('theme_morandi') }}" style="--c1:#9c6b5e;--c2:#6e8b6e"></a>
        <a class="swatch{% if theme == 'forest' %} active{% endif %}" href="/theme/forest"
           title="{{ t('theme_forest') }}" style="--c1:#2e6b4f;--c2:#6b8e5a"></a>
      </span>
      <span class="lang-switch">
        <a class="{% if lang == 'zh' %}active{% endif %}" href="/lang/zh">中</a>
        <a class="{% if lang == 'en' %}active{% endif %}" href="/lang/en">EN</a>
      </span>
    </div>
    {% if error %}<div class="msg">{{ t('login_error') }}</div>{% endif %}
    <form method="post" action="/login">
      <label>{{ t('login_id_label') }}</label>
      <input name="login_id" required autofocus>
      <label>{{ t('password') }}</label>
      <input name="password" type="password" required>
      <button class="btn" type="submit">{{ t('login') }}</button>
    </form>
  </div>
</div>
</body>
</html>
